[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynet-mcp-bridge"
version = "1.5.5"
description = "MCP server that connects AI models with Autodesk Navisworks, Revit and Civil 3D via the PyNet ecosystem."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RAEN Digital Tools" }
]
keywords = ["mcp", "navisworks", "autodesk", "BIM", "pynet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp, which server.py imports — keep the upper bound.
    "mcp[cli]>=1.2,<2",
    "psutil"
]

[project.urls]
Homepage = "https://github.com/Rafael-NunezDeArenas/PyNetBridge"
Repository = "https://github.com/Rafael-NunezDeArenas/PyNetBridge"

[project.scripts]
pynet-mcp-bridge = "pynet_mcp.server:main"
# Mantengo el viejo como alias por si acaso
pynet-bridge = "pynet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["pynet_mcp"]